<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tugas 2 - Modul 4</title>
        <style>
            body {
                font-family: 'Courier New', Courier, monospace;
                background: #16161e;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .kalkulator {
                background-color: #1a1b26;
                padding: 30px;
                border-radius: 8px;
                text-align: center;
            }

            br {
                border: 1px solid #2ac3de;
            }

            h1 {
                font-family: sans-serif;
                color: #f7768e;
                margin-bottom: 0px;
            }

            hr {
                height: 3px;
                border: none;
                margin-bottom: 30px;
                background-color: #ff9e64;
            }

            input {
                background: #565f89;
                color: #2ac3de;
                padding: 10px;
                width: 175px;
                text-align: center;
                border-radius: 5px;
                border: solid 1px #2ac3de;
            }

            input::placeholder {
                color: #cfc9c2;
                font-weight: bold;
            }

            select {
                background: #bb9af7;
                color: #1a1b26;
                height: 35px;
                width: 160px;
                text-align: center;
                border-radius: 5px;
                border: none;
                font-weight: bold;
                cursor: pointer;
            }

            button {
                background-color: #9ece6a;
                color: #1a1b26;
                font-weight: bold;
                margin: 10px;
                width: 120px;
                height: 40px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            span {
                background-color: #2ac3de;
                color: white;
                text-align: center;
                padding: 10px;
                width: 120px;
                height: 40px;
                border: none;
                border-radius: 5px;
            }

        </style>
    </head>
    <body>
        <div class="kalkulator">
            <h1 id="top">Kalkulator 2 Bilangan</h1><hr>
            <input type="number" id="input1" placeholder="Masukan Angka ke-1">
            <select id="pilihan">
                <option value="perjumlahan">Perjumlahan (+)</option>
                <option value="perkurangan">Perkurangan (-)</option>
                <option value="perkalian">Perkalian (*)</option>
                <option value="pembagian">Pembagian (/)</option>
            </select>
            <input type="number" id="input2" placeholder="Masukan Angka ke-2"><br>
            <button type="button" id="submit" onclick="hitungHasil()">Hitung</button>
            <span id="hasil"></span>
        </div>

        <script>
            function hitungHasil() {

                const input1 =  parseFloat(document.getElementById('input1').value);
                const input2 =  parseFloat(document.getElementById('input2').value);
                const pilihan = document.getElementById('pilihan').value;
                const hasil = document.getElementById('hasil');

                if (isNaN(input1) || isNaN(input2)){
                    hasil.textContent = "Mohon masukkan angka yang benar";
                    hasil.style.color = "red";
                    return;
                }

                let jumlah;

                switch (pilihan) {
                    case 'perjumlahan': jumlah = input1 + input2; break;

                    case 'pengurangan': jumlah = input1 - input2; break;

                    case 'perkalian': jumlah = input1 * input2; break;
                    
                    case 'pembagian':
                        if (input2==0) {
                            hasil.textContent = "Gakbisa membagi dengan nilai nol";
                            hasil.style.color = "red";
                            return;
                        } jumlah = input1 / input2; break;
                }

                hasil.textContent = jumlah;
                hasil.style.color = "green";
            }
        </script>
    </body>
</html>
