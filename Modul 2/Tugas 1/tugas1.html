<!DOCTYPE html>
<html>
    <head>
        <title>Tugas 1 - Modul 2</title>
    </head>
    <body>
        <form>
            <table>
                <tr>
                    <td><label>Input 1 (Tidak dapat di ganti)</label></td>
                    <td><input type="text" value="coba ganti" readonly></td>
                </tr>

                <tr>
                    <td><label>Input 2 (Maksimal 5 Karakter)</label></td>
                    <td><input type="text" maxlength="5"></td>
                </tr>

                <tr>
                    <td><label>Input 3 (Tidak dapat di klik atau diisi)</label></td>
                    <td><input type="text" value="coba klik" disabled></td>
                </tr>

                <tr>
                    <td><label>Input 4 (Hukumnya wajib diisi)</label></td>
                    <td><input type="text" required></td>
                </tr>

                <tr>
                    <td><label>Input 5 NIM (Maksimal 9 Gaboleh Kapital dan simbol)</label></td>
                    <td><input type="text" 
                                pattern="[a-z0-9]{9}"
                                maxlength="9">
                    </td>
                </tr>

            </table>
                <input type="submit" value="Test">
        </form>
    </body>
</html>
